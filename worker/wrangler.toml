name = "302-tools-proxy"
main = "index.js"
compatibility_date = "2024-11-01"

# Optional. See worker/README.md for the full table.
[vars]
MAX_BYTES = "33554432"
TIMEOUT_MS = "30000"
MAX_REDIRECTS = "5"
USER_AGENT = "302-tools/1.0 (+https://github.com/302-analytics)"

# Lock the proxy to your deployed app once you know its origin, e.g.
# ALLOW_ORIGIN = "https://302-analytics.github.io"
ALLOW_ORIGIN = "*"

# Optional hostname allow/block lists, comma separated. Empty = any public host.
# ALLOW_HOSTS = "goil.com.gh,gse.com.gh"
# BLOCK_HOSTS = ""
