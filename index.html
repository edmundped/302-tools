<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>302 Data Tools</title>
    <meta name="description" content="Turn PDFs, scans, spreadsheets and images into checkable analyst tables — entirely in your browser.">
    <meta name="color-scheme" content="light">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the workspace</a>

    <header class="app-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">302</span>
        <span class="brand-text">
          <span class="brand-name">Data Tools</span>
          <span class="brand-sub">Extraction desk for analyst tables</span>
        </span>
      </div>

      <nav class="tabs" id="tablist" role="tablist" aria-label="Workspace sections"></nav>

      <p class="privacy-pill" title="No file you open here is uploaded anywhere.">
        <span class="badge-dot" aria-hidden="true"></span>
        <span>Files never leave this browser</span>
      </p>
    </header>

    <main class="shell" id="main"></main>

    <noscript>
      <p style="padding: 24px; max-width: 60ch;">
        302 Data Tools reads your files in the browser using JavaScript modules.
        With JavaScript disabled there is nothing it can do — no part of this app
        runs on a server.
      </p>
    </noscript>

    <!-- CDN libraries, pinned to exact versions. Mirrored in js/core/config.js. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
